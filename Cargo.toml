[package]
name = "steganeur"
version = "0.1.0"
edition = "2024"
description = "Neural linguistic steganography using arithmetic coding with language models"
authors = ["steganeur contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[features]
default = ["llamacpp"]
llamacpp = ["dep:reqwest"]

[[bin]]
name = "steganeur"
path = "src/main.rs"